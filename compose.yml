name: educloud

x-backend-environment: &backend-environment
  ENVIRONMENT: local
  DEBUG: "false"
  DB_ENABLED: "true"
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: sms_app
  POSTGRES_PASSWORD: sms_app_password
  POSTGRES_DB: school_manage_db
  MIGRATION_USER: postgres
  MIGRATION_PASSWORD: postgres
  REDIS_ENABLED: "true"
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: local-development-secret-change-before-deploy
  CORS_ORIGINS: '["http://localhost:3000"]'
  FRONTEND_URL: http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_manage_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_manage_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    environment:
      <<: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    environment:
      <<: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api:8000
        API_V1_PREFIX: /api/v1
    environment:
      API_BASE_URL: http://api:8000
      API_V1_PREFIX: /api/v1
      COOKIE_SECURE: "false"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
