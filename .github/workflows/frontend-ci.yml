name: Frontend CI

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_manage_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d school_manage_db"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ENVIRONMENT: test
      DB_ENABLED: "true"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sms_app
      POSTGRES_PASSWORD: sms_app_password
      POSTGRES_DB: school_manage_db
      MIGRATION_USER: postgres
      MIGRATION_PASSWORD: postgres
      REDIS_ENABLED: "false"
      SECRET_KEY: ci-secret-key-not-for-production
      PAYMENT_GATEWAY: mock
      PAYMENT_GATEWAY_SECRET: ci-webhook-secret
      CORS_ORIGINS: '["http://127.0.0.1:3001"]'
      FRONTEND_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create restricted database role
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d school_manage_db -f backend/scripts/init-db.sql
      - name: Migrate and seed backend
        working-directory: backend
        run: uv sync --frozen && uv run alembic upgrade head && uv run python -m app.cli seed
      - name: Install frontend and browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
