# SchoolYar at https://sms.therawbit.ai
#
# Install:
#   cp deploy/vps/nginx/sms.therawbit.ai.conf /etc/nginx/sites-available/
#   ln -s ../sites-available/sms.therawbit.ai.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d sms.therawbit.ai     # adds `listen 443 ssl` + the HTTP->HTTPS redirect
#
# Only the Next.js app (127.0.0.1:3100) is public. The FastAPI backend listens on
# 127.0.0.1:8100 and is reached by Next's server-side BFF, never by the browser, so
# it has no server block of its own.
#
# Both apps already send `X-Robots-Tag: noindex, nofollow` themselves (backend
# always; frontend with SITE_NOINDEX=true), so it is not repeated here.

server {
    listen 80;
    listen [::]:80;
    server_name sms.therawbit.ai;

    # Visitor IP from Cloudflare (see the snippet for why).
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Textbook uploads go up to BOOKS_MAX_UPLOAD_MB=50.
    client_max_body_size 60m;

    # Let's Encrypt renewals, same as the other sites on this server.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # OVERWRITE, never append: the API rate-limits on the leftmost entry, so a
        # client-supplied X-Forwarded-For must not survive. After the realip
        # snippet, $remote_addr is the visitor's own address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Chapter uploads, PDF challans and AI paper generation can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
